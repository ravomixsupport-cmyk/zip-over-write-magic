<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ravomix – Offline</title>
  <style>
    :root {
      --offline-bg: #1B1E30;
      --offline-surface: #161929;
      --offline-border: #252840;
      --offline-text: hsl(240 20% 97%);
      --offline-muted: hsl(240 15% 72%);
      --offline-primary: hsl(245 58% 68%);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background: var(--offline-bg);
      color: var(--offline-text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .card {
      text-align: center;
      max-width: 380px;
      width: 100%;
      background: var(--offline-bg);
      border: 1px solid var(--offline-border);
      border-radius: 20px;
      padding: 40px 28px;
      box-shadow: 0 24px 70px rgba(0,0,0,0.28);
    }
    .icon-wrap {
      width: 84px; height: 84px;
      margin: 0 auto 20px;
      background: var(--offline-surface);
      border: 1px solid var(--offline-border);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .icon-wrap img { width: 100%; height: 100%; object-fit: cover; }
    h1 { font-size: 20px; font-weight: 700; margin-bottom: 8px; color: var(--offline-text); }
    p { font-size: 14px; margin-bottom: 28px; line-height: 1.5; color: var(--offline-muted); }
    .actions { display: grid; gap: 12px; justify-content: center; grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .btn {
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--offline-border);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .btn:active { transform: scale(0.96); }
    .btn-retry { background: var(--offline-primary); color: #fff; border-color: transparent; }
    .btn-back, .btn-close { background: var(--offline-surface); color: var(--offline-text); }
    @media (max-width: 420px) {
      .actions { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrap">
      <img src="/ravomix-icon-512.png" alt="Ravomix app icon" />
    </div>
    <h1>No Internet Connection</h1>
    <p>Please connect to the internet to continue using Ravomix.</p>
    <div class="actions">
      <button class="btn btn-back" onclick="history.back()">Back</button>
      <button class="btn btn-close" onclick="handleExit()">Exit</button>
      <button class="btn btn-retry" onclick="location.reload()">Retry</button>
    </div>
  </div>
  <script>
    function handleExit() {
      try {
        if (window.Android && typeof window.Android.closeApp === 'function') {
          window.Android.closeApp();
          return;
        }
        if (window.Android && typeof window.Android.exitApp === 'function') {
          window.Android.exitApp();
          return;
        }
      } catch (e) {}
      try {
        if (navigator.app && typeof navigator.app.exitApp === 'function') {
          navigator.app.exitApp();
          return;
        }
      } catch (e) {}
      try { window.close(); } catch (e) {}
      try { history.go(-(history.length - 1)); } catch (e) {}
    }
  </script>
</body>
</html>
